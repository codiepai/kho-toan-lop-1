<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho trò chơi Toán lớp 1 - Cô Điệp AI</title>
<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#e8f6ff;margin:0;padding:20px 16px 40px;color:#12304a}
h1{text-align:center;color:#0b5cab;font-size:28px;margin:6px 0 6px}
.gt{text-align:center;max-width:560px;margin:0 auto 18px;font-size:16px;line-height:1.4}
h2{max-width:560px;margin:26px auto 4px;font-size:21px;color:#0b5cab}
.ghi{max-width:560px;margin:0 auto 10px;font-size:14px;color:#4a6378}
.the{max-width:560px;margin:0 auto 12px;display:flex;gap:8px}
.the a{flex:1;padding:14px 18px;border-radius:16px;background:#f08c00;box-shadow:0 5px 0 #b86200;color:#fff;text-decoration:none}
.lop3 .the a{background:#2f9e44;box-shadow:0 5px 0 #1e6b2e}
.kd .the a{background:#7048e8;box-shadow:0 5px 0 #4c2fb0}
.the a b{display:block;font-size:21px;line-height:1.2}.the a span{font-size:15px}
.the button{flex:none;width:76px;border:3px solid #0b5cab;border-radius:16px;background:#fff;color:#0b5cab;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.the button.xong{background:#2f9e44;border-color:#2f9e44;color:#fff}
</style>
</head>
<body>
<h1 id="tieu-de">Kho trò chơi Toán lớp 1</h1>
<p class="gt">Trò chơi Toán lớp 1 (sách Kết nối tri thức) để chơi trên tivi hoặc điện thoại. Bấm vào tên trò để chơi, bấm "Chép link" để gửi cho đồng nghiệp hoặc phụ huynh.</p>
<div id="ds"></div>
<script>
// Mỗi trò một dòng: "ma" là tên file trong thư mục này (ma + '.html'). Trò mới nhất để trên cùng trong nhóm.
const NHOM = [
  { ten: 'Toán lớp 1 - Kho trò chơi', ghi: 'Khởi động chiếu tivi đầu tiết; luyện tập chơi trên tivi cả lớp hoặc ở nhà.', TRO: [
    { ma: 'so0-phep-tru', ten: 'Câu cá số 0 (luyện tập, trên tivi hoặc ở nhà)', tuan: 'Số 0 trong phép trừ (SGK tr.74-75)' },
    { ma: 'toan10f', ten: 'Luyện tập bằng 10 (tháp số, cộng ba số)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 6 Luyện tập' },
    { ma: 'kdtoan10f', ten: 'Đoàn tàu số 10 (khởi động, chiếu tivi)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 6 Luyện tập' },
    { ma: 'toan10e', ten: 'Cặp thẻ anh em (luyện tập, lật thẻ)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 5 Luyện tập' },
    { ma: 'kdtoan10e', ten: 'Bông hoa năm cánh (khởi động, chiếu tivi)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 5 Luyện tập' },
    { ma: 'toan10d', ten: 'Số 0 trong phép cộng (tìm chuồng cho thỏ)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 4' },
    { ma: 'kdtoan10d', ten: 'Thắp sáng ngôi sao (khởi động, chiếu tivi)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 4' },
    { ma: 'toan10c', ten: 'Thêm vào bằng mấy? (đường đua)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 3' },
    { ma: 'kdtoan10c', ten: 'Chú sâu tập đếm (khởi động, chiếu tivi)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 3' },
    { ma: 'toan10b', ten: 'Luyện tập phép cộng (hái táo, xoài, số còn thiếu)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 2 Luyện tập' },
    { ma: 'kdtoan10b', ten: 'Tô màu cầu vồng (khởi động, chiếu tivi)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 2 Luyện tập' },
    { ma: 'toan10', ten: 'Gộp lại bằng mấy? (luyện tập)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 1' },
    { ma: 'kdtoan10', ten: 'Vườn hoa phép cộng (khởi động, chiếu tivi)', tuan: 'Bài 10 Phép cộng trong phạm vi 10 - tiết 1' },
    { ma: 'toan9', ten: 'Siêu thám tử hình (luyện tập)', tuan: 'Bài 9 Luyện tập chung' },
    { ma: 'kdtoan9', ten: 'Ném bóng vào rổ (khởi động, chiếu tivi)', tuan: 'Bài 9 Luyện tập chung' },
    { ma: 'toan8b', ten: 'Ghép tam giác (luyện tập, kéo thả)', tuan: 'Bài 8 Thực hành lắp ghép, xếp hình - tiết 2 Luyện tập' },
    { ma: 'kdtoan8b', ten: 'Lắp tên lửa (khởi động, chiếu tivi)', tuan: 'Bài 8 Thực hành lắp ghép, xếp hình - tiết 2 Luyện tập' },
    { ma: 'toan8', ten: 'Xưởng lắp ghép (luyện tập, kéo thả)', tuan: 'Bài 8 Thực hành lắp ghép, xếp hình - tiết 1' },
    { ma: 'kdtoan8', ten: 'Ghép mũi tên (khởi động, chiếu tivi)', tuan: 'Bài 8 Thực hành lắp ghép, xếp hình - tiết 1' },
    { ma: 'toan7b', ten: 'Xưởng hình vui nhộn (luyện tập)', tuan: 'Bài 7 Hình vuông, hình tròn, hình tam giác, hình chữ nhật - tiết 2 Luyện tập' },
    { ma: 'kdtoan7b', ten: 'Thắp nến bánh sinh nhật (khởi động, chiếu tivi)', tuan: 'Bài 7 Hình vuông, hình tròn, hình tam giác, hình chữ nhật - tiết 2 Luyện tập' },
    { ma: 'toan7', ten: 'Thám tử hình (luyện tập)', tuan: 'Bài 7 Hình vuông, hình tròn, hình tam giác, hình chữ nhật - tiết 1' },
    { ma: 'kdtoan7', ten: 'Ngôi nhà bí mật (khởi động, chiếu tivi)', tuan: 'Bài 7 Hình vuông, hình tròn, hình tam giác, hình chữ nhật - tiết 1' },
    { ma: 'toan5', ten: 'Ôn Toán tuần 5', tuan: 'Tuần 5' },
    { ma: 'beca', ten: 'Bể cá Mấy và mấy', tuan: 'Tuần 4-5' }
  ]}
];
// link có ?lop=1.14 thì các trò chơi cũng mang theo lớp để ghi kết quả (chỉ dùng cho lớp của cô)
const lop = (new URLSearchParams(location.search).get('lop') || '').replace(/[^0-9A-Za-z.]/g, '');
if (lop) document.getElementById('tieu-de').textContent += ' - lớp ' + lop;
const goc = location.href.replace(/[^/]*$/, '');
const ds = document.getElementById('ds');
NHOM.forEach(n => {
  const khoi = document.createElement('section');
  if (n.lop) khoi.className = n.lop;
  const h = document.createElement('h2'); h.textContent = n.ten; khoi.appendChild(h);
  if (n.ghi) { const g = document.createElement('p'); g.className = 'ghi'; g.textContent = n.ghi; khoi.appendChild(g); }
  n.TRO.forEach(t => {
    const dong = document.createElement('div'); dong.className = 'the';
    const a = document.createElement('a');
    a.href = t.ma + '.html' + (lop ? '?lop=' + lop : '');
    const b = document.createElement('b'); b.textContent = t.ten;
    const s = document.createElement('span'); s.textContent = t.tuan;
    a.append(b, s);
    // nút chép link: luôn chép link KHÔNG có lớp, để người khác chơi không bị ghi vào bảng của cô
    const nut = document.createElement('button'); nut.textContent = 'Chép link';
    nut.onclick = () => {
      const link = goc + t.ma + '.html';
      const xong = () => { nut.textContent = 'Đã chép'; nut.classList.add('xong'); setTimeout(() => { nut.textContent = 'Chép link'; nut.classList.remove('xong'); }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(xong, () => prompt('Chép link này:', link));
      else prompt('Chép link này:', link);
    };
    dong.append(a, nut);
    khoi.appendChild(dong);
  });
  ds.appendChild(khoi);
});
</script>
</body>
</html>
